# --------------------------------------------------------------------------------------------
# This file is generated. Do not edit manually
# --------------------------------------------------------------------------------------------
name: Electron app BETA
'on':
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: dbgate-app
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
          - ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools
      - name: Install python 3.11 (MacOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install python@3.11
          echo "PYTHON=/opt/homebrew/bin/python3.11" >> $GITHUB_ENV
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v1
        with:
          node-version: 22.x
      - name: adjustPackageJson
        run: |

          node adjustPackageJson --community
      - name: setUpdaterChannel beta
        run: |

          node setUpdaterChannel beta
      - name: yarn set timeout
        run: |

          yarn config set network-timeout 100000
      - name: yarn install
        run: |

          yarn install
      - name: setCurrentVersion
        run: |

          yarn setCurrentVersion
      - name: fillPackagedPlugins
        run: |

          yarn fillPackagedPlugins
      - name: Install Snapcraft
        if: matrix.os == 'ubuntu-22.04'
        uses: samuelmeuli/action-snapcraft@v1
      - name: Publish Windows
        if: matrix.os == 'windows-latest'
        env:
          GYP_MSVS_VERSION: '2022'
          GYP_MSVS_OVERRIDE_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise
        run: |

          yarn run build:app
      - name: Verify Windows artifact structure (plugins in asar)
        if: matrix.os == 'windows-latest'
        run: |
          node common/verifyWindowsArtifacts.js app/dist/win-unpacked/resources/app.asar .
      - name: Windows launch smoke test (unpacked build)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "app\dist\win-unpacked\DbGate.exe"
          if (-not (Test-Path $exe)) { Write-Error "Built executable not found: $exe"; exit 1 }
          $env:SMOKE_TEST = "1"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(300000)) {
            $proc.Kill()
            Write-Error "SMOKE-TEST FAIL: app did not exit within 300 seconds"
            exit 1
          }
          if ($proc.ExitCode -ne 0) { Write-Error "SMOKE-TEST FAIL: exit code $($proc.ExitCode)"; exit 1 }
          Write-Host "SMOKE-TEST PASS: unpacked Windows build starts, loads plugins and exits cleanly"
      - name: NSIS silent install to custom path with spaces
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          for %%f in (app\dist\*win_x64.exe) do set "INSTALLER=%%f"
          echo Installing %INSTALLER%
          "%INSTALLER%" /S /D=C:\Program Files\DbGate Eval Dir
          if errorlevel 1 (echo Installer failed & exit /b 1)
      - name: Verify NSIS installation location
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installDir = "C:\Program Files\DbGate Eval Dir"
          $installedExe = Join-Path $installDir "DbGate.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Host "Installed executable not found at $installedExe - diagnostics:"
            Get-ChildItem "C:\Program Files" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem $installDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem "C:\Program Files\DbGate" -Recurse -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem "$env:LOCALAPPDATA\Programs\DbGate" -Recurse -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            reg query "HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall" /s /f "DbGate" 2>$null
            reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall" /s /f "DbGate" 2>$null
            Write-Error "NSIS installer did not install to the requested custom directory"
            exit 1
          }
          node common/verifyWindowsArtifacts.js (Join-Path $installDir "resources\app.asar") .
          Write-Host "NSIS install to custom path with spaces: OK"
      - name: Installed app launch smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "C:\Program Files\DbGate Eval Dir\DbGate.exe"
          $env:SMOKE_TEST = "1"
          $proc = Start-Process -FilePath $exe -PassThru
          if (-not $proc.WaitForExit(300000)) {
            $proc.Kill()
            Write-Error "SMOKE-TEST FAIL: installed app did not exit within 300 seconds"
            exit 1
          }
          if ($proc.ExitCode -ne 0) { Write-Error "SMOKE-TEST FAIL: exit code $($proc.ExitCode)"; exit 1 }
          Write-Host "SMOKE-TEST PASS: installed app starts, loads plugins and exits cleanly"
          $uninstaller = "C:\Program Files\DbGate Eval Dir\Uninstall DbGate.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
          }
      - name: Publish MacOS
        if: matrix.os == 'macos-14'
        run: |

          yarn run build:app
        env:
          CSC_LINK: ${{ secrets.APPLECERT_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLECERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{secrets.APPLE_APP_SPECIFIC_PASSWORD}}
      - name: Publish Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |

          yarn run build:app
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{secrets.SNAPCRAFT_LOGIN}}
      - name: Check signing credentials
        if: matrix.os == 'windows-latest'
        id: signcheck
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_TC_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Azure login (OIDC)
        uses: azure/login@v2
        if: matrix.os == 'windows-latest' && steps.signcheck.outputs.present == 'true'
        with:
          client-id: ${{ secrets.AZURE_TC_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TC_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign Windows artifacts with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0
        if: matrix.os == 'windows-latest' && steps.signcheck.outputs.present == 'true'
        with:
          endpoint: https://wus3.codesigning.azure.net/
          trusted-signing-account-name: DbGate
          certificate-profile-name: DbGate-Release
          files-folder: app/dist
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Fix YML hashes
        if: matrix.os == 'windows-latest'
        run: |

          yarn run fixYmlHashes
      - name: Copy artifacts
        run: |
          mkdir artifacts          

          cp app/dist/*.deb artifacts/dbgate-beta.deb || true
          cp app/dist/*x86*.AppImage artifacts/dbgate-beta.AppImage || true
          cp app/dist/*arm64*.AppImage artifacts/dbgate-beta-arm64.AppImage || true
          cp app/dist/*armv7l*.AppImage artifacts/dbgate-beta-armv7l.AppImage || true
          cp app/dist/*win*.exe artifacts/dbgate-beta.exe || true
          cp app/dist/*win_x64.zip artifacts/dbgate-windows-beta.zip || true
          cp app/dist/*win_arm64.zip artifacts/dbgate-windows-beta-arm64.zip || true
          cp app/dist/*win_arm64.exe artifacts/dbgate-windows-beta-arm64.exe || true
          cp app/dist/*-mac_universal.dmg artifacts/dbgate-beta.dmg || true
          cp app/dist/*-mac_x64.dmg artifacts/dbgate-beta-x64.dmg || true
          cp app/dist/*-mac_arm64.dmg artifacts/dbgate-beta-arm64.dmg || true
          mv app/dist/*.snap artifacts/dbgate-beta.snap || true

          mv app/dist/*.exe artifacts/ || true
          mv app/dist/*.zip artifacts/ || true
          mv app/dist/*.tar.gz artifacts/ || true
          mv app/dist/*.AppImage artifacts/ || true
          mv app/dist/*.deb artifacts/ || true
          mv app/dist/*.snap artifacts/ || true
          mv app/dist/*.dmg artifacts/ || true
          mv app/dist/*.blockmap artifacts/ || true

          mv app/dist/*.yml artifacts/ || true
          rm artifacts/builder-debug.yml
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Print content of notarization-error.log
        if: failure() && matrix.os == 'macos-14'
        run: |

          find . -type f -name "notarization-error.log" -exec echo "=== Start of {} ===" \; -exec cat {} \; -exec echo "=== End of {} ===" \;
